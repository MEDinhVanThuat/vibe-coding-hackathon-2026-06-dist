name: vibe-coding-hackathon

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    platform: linux/arm64
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    command: npm run dev

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    platform: linux/arm64
    ports:
      - "4000:4000"
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/meetings
      PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts && npm run dev"

  db:
    image: postgres:16-alpine
    platform: linux/arm64
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: meetings
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d meetings"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  web_node_modules:
  web_next:
  api_node_modules:
  db_data:
